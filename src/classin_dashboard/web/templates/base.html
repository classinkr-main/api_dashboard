<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ClassIn 대시보드{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea;
  --text: #1c2430; --muted: #6b7686;
  --accent: #2f6fed; --accent-soft: #e8effd;
  --ok: #1e9e6a; --warn: #d97706; --bad: #dc2626;
  --radius: 10px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header.topbar {
  display: flex; align-items: center; gap: 20px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 10px 24px;
}
.topbar .brand { font-weight: 700; font-size: 15px; color: var(--text); }
.topbar nav { display: flex; gap: 4px; flex: 1; }
.topbar nav a {
  padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500;
}
.topbar nav a.active, .topbar nav a:hover {
  background: var(--accent-soft); color: var(--accent); text-decoration: none;
}
.topbar .who { color: var(--muted); font-size: 13px; }

main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
h1 { font-size: 20px; margin: 0 0 16px; }
h2 { font-size: 16px; margin: 24px 0 10px; }

.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
}
.grid { display: grid; gap: 14px; }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

.stat { padding: 14px 16px; }
.stat .label { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
.stat .value { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

table.data { width: 100%; border-collapse: collapse; }
table.data th, table.data td {
  text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
table.data th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.data tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent);
}
.badge.ok { background: #e5f6ee; color: var(--ok); }
.badge.warn { background: #fdf0e0; color: var(--warn); }
.badge.bad { background: #fdeaea; color: var(--bad); }
.badge.muted { background: #eef0f3; color: var(--muted); }

form.stack label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
input[type=text], input[type=password], textarea, select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: 8px; font: inherit; background: #fff; color: var(--text);
}
textarea { min-height: 140px; resize: vertical; }
button, .btn {
  display: inline-block; margin-top: 14px; padding: 9px 18px;
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  font: inherit; font-weight: 600; cursor: pointer;
}
button.secondary, .btn.secondary { background: #eef0f3; color: var(--text); }
button:hover { filter: brightness(1.05); }

.notice { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
.notice.error { background: #fdeaea; color: var(--bad); }
.notice.ok { background: #e5f6ee; color: var(--ok); }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.empty { color: var(--muted); padding: 20px; text-align: center; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if session %}
<header class="topbar">
  <span class="brand">ClassIn 대시보드</span>
  <nav>
    <a href="{{ url_for('dashboard_home') }}" class="{{ 'active' if nav == 'dashboard' }}">대시보드</a>
    <a href="{{ url_for('students_view') }}" class="{{ 'active' if nav == 'students' }}">학생별</a>
    <a href="{{ url_for('teachers_view') }}" class="{{ 'active' if nav == 'teachers' }}">선생님별</a>
    <a href="{{ url_for('create_home') }}" class="{{ 'active' if nav == 'create' }}">생성</a>
    <a href="{{ url_for('notify_home') }}" class="{{ 'active' if nav == 'notify' }}">알림</a>
  </nav>
  <span class="who">{{ session.role_label }} · SID {{ session.sid }}</span>
  <a href="{{ url_for('logout') }}">로그아웃</a>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
